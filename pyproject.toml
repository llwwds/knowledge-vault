[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-vault"
version = "2.5.0.0"
description = "个人知识库后端：真源与索引分离的登记层（SQLite）+ 混合召回索引层（zvec/FTS5/图扩展），headless API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zvec>=0.7.0",
    "FlagEmbedding>=1.3.11",
    "jieba>=0.42.1",
    "numpy>=2.0",
]

[project.scripts]
kv = "knowledge_vault.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_vault"]
# 包内数据资源必须随 wheel 分发（userdict 等）；防 .gitignore 规则误伤
artifacts = ["src/knowledge_vault/data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 真实模型冒烟测试（默认跳过，环境变量 opt-in）"]
